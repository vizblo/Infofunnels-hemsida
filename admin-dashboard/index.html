<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>InfoFunnels HQ</title>
<link rel="icon" type="image/png" href="/favicon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: fixed left rail (brand + nav) beside a scrolling work area; the rail folds into a top tab strip on phones.
   Single dark look, matching infofunnels.co. */
:root {
  --bg: #09090b;
  --surface: #111114;
  --surface-2: #17171c;
  --raise: #1d1d23;
  --line: rgba(255,255,255,.08);
  --line-strong: rgba(255,255,255,.14);
  --fg: #ffffff;
  --fg-2: #d4d4d8;
  --muted: #a1a1aa;
  --dim: #71717a;
  --gold: #c4a852;
  --gold-hi: #d4bc72;
  --gold-soft: rgba(196,168,82,.16);
  --gold-line: rgba(196,168,82,.28);
  --gold-2: #8a7739;
  --good: #4ade80;
  --good-soft: rgba(74,222,128,.12);
  --warn: #fbbf24;
  --warn-soft: rgba(251,191,36,.12);
  --bad: #f87171;
  --bad-soft: rgba(248,113,113,.12);
  --display: "Plus Jakarta Sans", "Inter", system-ui, -apple-system, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 12px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--body); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--gold); }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.app { display: grid; grid-template-columns: 236px minmax(0,1fr); min-height: 100vh; }
.side { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: 100vh; display: flex; flex-direction: column; gap: 28px; padding: 26px 18px; border-right: 1px solid var(--line); background: linear-gradient(180deg, #0d0d10 0%, var(--bg) 100%); }
.brand { display: flex; flex-direction: column; gap: 8px; padding: 0 8px; }
.brand img { width: 150px; height: auto; filter: invert(1); display: block; }
.brand .tag { font-family: var(--display); font-weight: 700; font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; color: var(--muted); font-weight: 500; }
.nav button svg { width: 17px; height: 17px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.nav button:hover { color: var(--fg); background: rgba(255,255,255,.04); }
.nav button[aria-current="page"] { color: var(--fg); background: var(--gold-soft); box-shadow: inset 0 0 0 1px var(--gold-line); }
.nav button[aria-current="page"] svg { stroke: var(--gold); }
.nav button:focus-visible { outline: 2px solid var(--gold); }
.side-foot { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px 8px 0; border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px; min-width: 0; }
.side-foot img { width: 28px; height: 28px; border-radius: 50%; flex: none; }
.side-foot span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.main { padding-inline: clamp(16px, 4vw, 44px); padding-block: 34px 60px; min-width: 0; max-width: 1180px; width: 100%; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 24px; margin-bottom: 26px; }
.eyebrow { font-family: var(--display); font-size: 11.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
.page-head h1 { font-size: clamp(26px, 3.2vw, 34px); font-weight: 800; letter-spacing: -.02em; line-height: 1.12; }
.page-head p { margin: 6px 0 0; color: var(--muted); max-width: 60ch; }

.panel { background: linear-gradient(160deg, #141310 0%, var(--surface) 60%); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; min-width: 0; }
.panel h2 { font-size: 15.5px; font-weight: 700; letter-spacing: -.005em; }
.panel-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
.panel-head .sub { color: var(--dim); font-size: 12.5px; }
.stack { display: flex; flex-direction: column; gap: 18px; }
.grid-2 { display: grid; grid-template-columns: minmax(0,1.55fr) minmax(0,1fr); gap: 18px; }
.grid-2 > * { min-width: 0; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.kpi { background: var(--surface); padding: 18px 20px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi.lead { background: linear-gradient(145deg, rgba(196,168,82,.20) 0%, rgba(196,168,82,.05) 55%, var(--surface) 100%); }
.kpi .lab { font-size: 12px; color: var(--muted); font-weight: 500; }
.kpi .val { font-family: var(--display); font-weight: 800; font-size: clamp(22px, 2.4vw, 28px); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.kpi.lead .val { color: var(--gold-hi); }
.kpi .note { font-size: 12px; color: var(--dim); }
.delta { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; font-size: 12px; padding: 1px 7px; border-radius: 99px; width: fit-content; }
.delta.up { color: var(--good); background: var(--good-soft); }
.delta.down { color: var(--bad); background: var(--bad-soft); }
.delta.flat { color: var(--muted); background: rgba(255,255,255,.05); }

.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--dim); font-family: var(--body); font-size: 11px; }
.chart .vl { fill: var(--fg-2); font-weight: 600; font-size: 10.5px; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

.btn { all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 16px; border-radius: 9px; font-weight: 600; font-size: 13.5px; background: var(--gold); color: #0b0b0d; white-space: nowrap; }
.btn:hover { background: var(--gold-hi); }
.btn:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.btn[disabled] { opacity: .5; cursor: default; }
.btn.ghost { background: transparent; color: var(--fg-2); box-shadow: inset 0 0 0 1px var(--line-strong); }
.btn.ghost:hover { color: var(--fg); box-shadow: inset 0 0 0 1px var(--gold-line); background: rgba(196,168,82,.06); }
.btn.sm { padding: 6px 11px; font-size: 12.5px; border-radius: 7px; }
.btn.danger { background: transparent; color: var(--bad); box-shadow: inset 0 0 0 1px rgba(248,113,113,.35); }
.btn.danger.armed { background: var(--bad); color: #160606; }
.icon-btn { all: unset; cursor: pointer; color: var(--dim); padding: 4px 6px; border-radius: 6px; font-size: 18px; line-height: 1; }
.icon-btn:hover { color: var(--bad); background: var(--bad-soft); }
.icon-btn:focus-visible { outline: 2px solid var(--gold); }

label.f { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 13px; color: var(--fg-2); min-width: 0; }
label.f .hint { font-weight: 400; color: var(--dim); font-size: 12px; }
.inp { width: 100%; background: var(--bg); border: 1px solid var(--line-strong); border-radius: 9px; padding: 9px 12px; color: var(--fg); outline: none; min-width: 0; }
.inp:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }
textarea.inp { resize: vertical; min-height: 84px; line-height: 1.5; }
.inp::placeholder { color: var(--dim); }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.row > * { flex: 1 1 160px; }

.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font-weight: 600; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th.r, td.r { text-align: right; }
tr.click { cursor: pointer; }
tr.click:hover td { background: rgba(255,255,255,.025); }
tr.sel td { background: var(--gold-soft); }
tfoot td { font-weight: 700; border-bottom: 0; color: var(--fg); }
.ed td { padding: 6px 6px; }
.ed .inp { padding: 7px 10px; }
.gold { color: var(--gold-hi); }
.muted { color: var(--muted); }
.dim { color: var(--dim); }

.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.ok { color: var(--good); background: var(--good-soft); }
.chip.pend { color: var(--warn); background: var(--warn-soft); }

.people { display: flex; flex-direction: column; }
.person { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.person:last-child { border-bottom: 0; }
.person img { width: 32px; height: 32px; border-radius: 50%; flex: none; }
.person .who { flex: 1; min-width: 0; }
.person .who b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.person .who small { color: var(--dim); font-size: 12px; }

.links { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.link { position: relative; display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); text-decoration: none; color: var(--fg); min-width: 0; transition: border-color .15s, background .15s; }
.link:hover { border-color: var(--gold-line); background: #1b1a16; }
.link .ico { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; background: var(--gold-soft); color: var(--gold); flex: none; font-family: var(--display); font-weight: 800; font-size: 14px; }
.link .txt { min-width: 0; flex: 1; }
.link b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.link small { display: block; color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.link-wrap { position: relative; min-width: 0; }
.link-wrap .rm { position: absolute; top: 6px; right: 6px; }

.empty { border: 1px dashed var(--line-strong); border-radius: 10px; padding: 22px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--fg-2); font-family: var(--display); margin-bottom: 4px; }

/* EOD form */
.q { display: grid; grid-template-columns: 28px minmax(0,1fr); gap: 4px 12px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.q:last-of-type { border-bottom: 0; }
.q .n { font-family: var(--display); font-weight: 800; color: var(--gold); font-size: 13px; padding-top: 1px; }
.q .qt { font-weight: 600; color: var(--fg); font-size: 14.5px; }
.q .qh { color: var(--dim); font-size: 12.5px; margin-bottom: 8px; }
.q .body { grid-column: 2; min-width: 0; }
.req { color: var(--gold); }
.scale { display: flex; gap: 6px; flex-wrap: wrap; }
.scale input { position: absolute; opacity: 0; pointer-events: none; }
.scale label { cursor: pointer; display: grid; place-items: center; min-width: 46px; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line-strong); color: var(--muted); font-weight: 600; text-align: center; font-size: 13px; line-height: 1.2; }
.scale label small { display: block; font-weight: 400; font-size: 10.5px; color: var(--dim); }
.scale input:checked + label { border-color: var(--gold); background: var(--gold-soft); color: var(--gold-hi); }
.scale input:focus-visible + label { outline: 2px solid var(--gold); outline-offset: 2px; }
.form-foot { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding-top: 18px; border-top: 1px solid var(--line); margin-top: 4px; }
.success { border: 1px solid var(--gold-line); background: linear-gradient(145deg, rgba(196,168,82,.16), rgba(196,168,82,.03) 60%); border-radius: var(--r); padding: 20px; }
.success h2 { font-size: 18px; margin-bottom: 4px; }
pre.slack { white-space: pre-wrap; word-break: break-word; background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 14px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; color: var(--fg-2); margin: 12px 0; max-height: 320px; overflow: auto; }

/* report feed */
.day { display: flex; flex-direction: column; gap: 10px; }
.day-h { display: flex; align-items: baseline; gap: 10px; font-family: var(--display); font-weight: 700; font-size: 14px; color: var(--fg-2); padding-top: 6px; }
.day-h span { font-family: var(--body); font-weight: 500; font-size: 12px; color: var(--dim); }
.rep { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; min-width: 0; }
.rep-top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.rep-top img { width: 34px; height: 34px; border-radius: 50%; }
.rep-top .who { flex: 1; min-width: 0; }
.rep-top .who b { display: block; }
.rep-top .who small { color: var(--dim); font-size: 12px; }
.meter { display: inline-flex; gap: 3px; vertical-align: middle; }
.meter i { width: 8px; height: 8px; border-radius: 2px; background: rgba(255,255,255,.1); }
.meter i.on { background: var(--gold); }
.rep dl { display: grid; grid-template-columns: 150px minmax(0,1fr); gap: 8px 16px; margin: 0; }
.rep dt { color: var(--dim); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; padding-top: 2px; }
.rep dd { margin: 0; white-space: pre-wrap; word-break: break-word; color: var(--fg-2); }
.rep dd.block { color: var(--warn); }

.code { display: flex; gap: 8px; align-items: stretch; min-width: 0; }
.code code { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 12.5px; color: var(--fg-2); overflow-x: auto; white-space: nowrap; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
.steps { margin: 0; padding-left: 20px; color: var(--fg-2); display: flex; flex-direction: column; gap: 10px; }
.steps li::marker { color: var(--gold); font-weight: 700; }

.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); opacity: 0; background: var(--raise); border: 1px solid var(--gold-line); color: var(--fg); padding: 10px 16px; border-radius: 10px; font-weight: 500; transition: .2s; pointer-events: none; z-index: 10; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; transform: translateX(-50%); }
.loading { color: var(--muted); padding: 60px 0; }
.notice { border: 1px solid var(--line-strong); border-radius: 10px; padding: 12px 14px; color: var(--muted); font-size: 13px; background: var(--surface); }

@media (max-width: 1000px) { .grid-2 { grid-template-columns: minmax(0,1fr); } .kpis { grid-template-columns: repeat(2, minmax(0,1fr)); } }
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0,1fr); }
  .side { position: sticky; top: env(safe-area-inset-top, 0px); height: auto; z-index: 5; flex-direction: row; align-items: center; gap: 14px; padding: 12px 16px; border-right: 0; border-bottom: 1px solid var(--line); background: rgba(9,9,11,.94); backdrop-filter: blur(8px); overflow-x: auto; }
  .brand { padding: 0; flex: none; }
  .brand img { width: 108px; }
  .brand .tag { display: none; }
  .nav { flex-direction: row; gap: 2px; }
  .nav button { white-space: nowrap; padding: 7px 10px; font-size: 13px; }
  .nav button svg { display: none; }
  .side-foot { display: none; }
  .main { padding-block: 22px 48px; }
}
@media (max-width: 560px) {
  .rep dl { grid-template-columns: minmax(0,1fr); gap: 2px; }
  .rep dd { margin-bottom: 8px; }
  .q { grid-template-columns: minmax(0,1fr); }
  .q .n { display: none; }
  .q .body { grid-column: 1; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.av { display: inline-grid; place-items: center; border-radius: 50%; flex: none; font-family: var(--display); font-weight: 700; letter-spacing: .02em; }
.side-foot .so { margin-left: auto; padding: 5px 9px; font-size: 12px; }
.mob-only { display: none !important; }
.bad { color: var(--bad); }
.lc { text-transform: none; letter-spacing: 0; font-weight: 500; }
.sm-l { font-size: 12px; }
.ed-n { font-weight: 700; font-size: 16px; }
.ed-big { font-family: var(--display); font-weight: 800; font-size: 24px; }
.login { min-height: 100vh; display: grid; place-items: center; padding-inline: 16px; padding-block: 40px; background: radial-gradient(circle at 50% 0%, rgba(196,168,82,.14) 0%, transparent 55%), var(--bg); }
.login-card { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 14px; background: linear-gradient(160deg, #18140a 0%, #0b0b12 100%); border: 1px solid var(--gold-line); border-radius: 16px; padding: 30px 26px; }
.login-card .wm { width: 160px; filter: invert(1); }
.login-card .tag { font-family: var(--display); font-weight: 700; font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); margin-top: -6px; }
.login-card h1 { font-size: 24px; font-weight: 800; margin-top: 8px; }
.login-card p { margin: -6px 0 4px; }
.login-card .btn { width: 100%; padding: 11px 16px; }
.err { color: var(--bad); font-size: 13px; min-height: 1em; }
@media (max-width: 820px) { .mob-only { display: flex !important; color: var(--dim) !important; } }

html, body { margin: 0; }
[hidden] { display: none !important; }

/* applications */
.nav .nbadge { margin-left: auto; background: var(--gold); color: #0b0b0d; font-size: 11px; font-weight: 700; border-radius: 99px; padding: 1px 7px; font-variant-numeric: tabular-nums; }
.chip.new { color: var(--warn); background: var(--warn-soft); }
.chip.open, .chip.shortlisted { color: var(--good); background: var(--good-soft); }
.chip.closed, .chip.rejected { color: var(--bad); background: var(--bad-soft); }
.apps { display: grid; grid-template-columns: 260px minmax(0,1fr); gap: 20px; align-items: start; }
.apps > * { min-width: 0; }
@media (max-width: 1000px) { .apps { grid-template-columns: minmax(0,1fr); } }
.apps-side { display: flex; flex-direction: column; gap: 8px; }
.fcard { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; gap: 3px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); min-width: 0; }
.fcard:hover { border-color: var(--gold-line); }
.fcard[aria-current="true"] { border-color: var(--gold); background: var(--gold-soft); }
.fcard:focus-visible { outline: 2px solid var(--gold); }
.fcard .t { font-weight: 600; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.fcard .u { font-size: 12.5px; color: var(--dim); overflow-wrap: anywhere; }
.ahead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px 20px; margin-bottom: 14px; }
.ahead h2 { font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
.aurl { color: var(--gold); font-size: 13px; overflow-wrap: anywhere; }
.atabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.atabs button { all: unset; cursor: pointer; padding: 10px 14px; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.atabs button:hover { color: var(--fg); }
.atabs button[aria-selected="true"] { color: var(--fg); border-color: var(--gold); }
.atabs button:focus-visible { outline: 2px solid var(--gold); }
.aform { display: flex; flex-direction: column; gap: 14px; }
.aform .row { margin-bottom: 12px; }
.psub { color: var(--dim); font-size: 12.5px; margin: 4px 0 14px; }
.aslug { display: flex; align-items: stretch; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--bg); overflow: hidden; min-width: 0; }
.aslug:focus-within { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }
.aslug span { padding: 9px 0 9px 12px; color: var(--dim); white-space: nowrap; font-weight: 400; }
.aslug .inp { border: 0; box-shadow: none; border-radius: 0; padding-left: 2px; }
.aslug .inp:focus { box-shadow: none; }
.aslug .inp:disabled { color: var(--muted); }
@media (max-width: 560px) { .aslug span { display: none; } .aslug .inp { padding-left: 12px; } }
.drow { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.6fr) auto; gap: 8px; margin-bottom: 8px; align-items: center; }
.aq { border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 10px; background: rgba(255,255,255,.015); }
.aqh { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; color: var(--dim); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.aq .row { margin-bottom: 8px; }
.icon-btn.mv:hover { color: var(--fg); background: rgba(255,255,255,.06); }
.icon-btn[disabled] { opacity: .3; pointer-events: none; }
.chk { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; color: var(--fg-2); cursor: pointer; }
.chk input { accent-color: var(--gold); width: 16px; height: 16px; }
.savebar { position: sticky; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; padding: 14px 16px; background: rgba(13,13,16,.94); backdrop-filter: blur(8px); border: 1px solid var(--line-strong); border-radius: var(--r); }
.afilters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; align-items: center; }
.pill { all: unset; cursor: pointer; padding: 5px 12px; border-radius: 99px; font-weight: 600; font-size: 12.5px; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line-strong); }
.pill:hover { color: var(--fg); }
.pill[aria-pressed="true"] { background: var(--gold-soft); color: var(--fg); box-shadow: inset 0 0 0 1px var(--gold); }
.pill:focus-visible { outline: 2px solid var(--gold); }
details.asub { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); margin-bottom: 8px; }
details.asub[open] { border-color: var(--gold-line); }
details.asub summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px 12px; padding: 12px 14px; flex-wrap: wrap; }
details.asub summary::-webkit-details-marker { display: none; }
details.asub summary:focus-visible { outline: 2px solid var(--gold); border-radius: 10px; }
details.asub summary .who { font-weight: 600; flex: 1 1 200px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
details.asub summary .who small { color: var(--dim); font-weight: 400; margin-left: 8px; }
details.asub summary .when { color: var(--dim); font-size: 12.5px; white-space: nowrap; }
.sbody { padding: 4px 16px 16px; border-top: 1px solid var(--line); }
.sbody .ctl { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 12px 0; }
.qa { margin: 0; }
.qa dt { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); margin-top: 14px; }
.qa dd { margin: 2px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--fg-2); }
.arow { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 10px 8px; margin: 0 -8px; border-radius: 8px; border-bottom: 1px solid var(--line); min-width: 0; }
.arow:last-child { border-bottom: 0; }
.arow:hover { background: rgba(255,255,255,.03); }
.arow:focus-visible { outline: 2px solid var(--gold); }
.arow .who { flex: 1; min-width: 0; }
.arow .who b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.arow .who small { color: var(--dim); font-size: 12px; overflow-wrap: anywhere; }
</style>
</head>
<body>
<div class="login" id="login"><div class="loading">Opening HQ…</div></div>
<div class="app" id="app" hidden>
  <aside class="side">
    <div class="brand">
      <img alt="InfoFunnels" src="/wordmark.png">
      <div class="tag">Headquarters</div>
    </div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="side-foot" id="who"></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(() => {
"use strict";
const ICONS = {
  dashboard: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
  revenue: '<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  eod: '<svg viewBox="0 0 24 24"><path d="M9 4h6M9 4a2 2 0 0 0-2 2H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-1a2 2 0 0 0-2-2M9 13l2 2 4-4"/></svg>',
  reports: '<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
  links: '<svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>',
  applications: '<svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>',
  team: '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/></svg>'
};
const VIEWS_OWNER = [["dashboard","Dashboard"],["revenue","Finances"],["applications","Applications"],["reports","EOD reports"],["eod","Submit EOD"],["links","Quick links"],["team","Team"]];
const VIEWS_TEAM = [["eod","Submit EOD"],["reports","Team reports"]];
const SITE = location.origin;

const S = {
  me: null, uid: null, owner: false, slackOn: false, adminUsername: "admin",
  view: null, rate: 0.2, months: {}, links: [], users: {}, reports: {},
  edit: null, selMonth: null, filter: "all", lastSubmitted: null, importRows: null, loaded: false
};
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const usd = n => new Intl.NumberFormat("sv-SE", { style: "currency", currency: "SEK", maximumFractionDigits: 0 }).format(Math.round(n || 0)); // amounts are kronor
const usdK = n => n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e4 ? Math.round(n / 1e3) + "k" : n >= 1e3 ? (n / 1e3).toFixed(1) + "k" : String(Math.round(n));
const pad = n => String(n).padStart(2, "0");
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const ymNow = () => todayStr().slice(0, 7);
const addM = (ym, k) => { let [y, m] = ym.split("-").map(Number); m += k; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } return `${y}-${pad(m)}`; };
const MN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MFULL = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const ymLabel = (ym, full) => { const [y, m] = ym.split("-").map(Number); return (full ? MFULL : MN)[m - 1] + " " + y; };
const dayLabel = ds => { const [y, m, d] = ds.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString("en-US", { weekday: "long", day: "numeric", month: "short" }); };
const money = s => {
  let t = String(s ?? "").replace(/[\s\u00a0]|kr|sek|\$/gi, "");
  if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(t)) t = t.replace(/\./g, "").replace(",", ".");
  else if (/,\d{1,2}$/.test(t) && !t.includes(".")) t = t.replace(",", ".");
  else t = t.replace(/,/g, "");
  const n = parseFloat(t); return isFinite(n) ? n : 0;
};
const ls = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }, del(k) { try { localStorage.removeItem(k); } catch {} } };

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2800); }
async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); toast("Copied."); }
  catch { const pre = btn?.closest("[data-copy-scope]")?.querySelector("pre, code"); if (pre) { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast("Text selected. Press ⌘C / Ctrl+C to copy."); }
}

/* ---------- API ---------- */
class ApiError extends Error { constructor(status, data) { super(data?.error || "Request failed"); this.status = status; this.data = data; } }
async function api(action, data = {}) {
  let r;
  try { r = await fetch("/api/hq", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action, ...data }) }); }
  catch { throw new ApiError(0, { error: "Can't reach the server. Check your connection." }); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) {
    if (r.status === 401 && action !== "login") { showLogin(); }
    throw new ApiError(r.status, j);
  }
  return j;
}
function ingest(d) {
  S.me = d.me; S.uid = d.me.id; S.owner = !!d.me.admin; S.slackOn = !!d.slack;
  S.users = {}; d.users.forEach(u => S.users[u.id] = u);
  S.reports = {}; d.reports.forEach(r => (S.reports[r.uid] = S.reports[r.uid] || []).push(r));
  Object.values(S.reports).forEach(l => l.sort((a, b) => b.date.localeCompare(a.date)));
  if (S.owner) { S.months = d.months || {}; S.rate = d.settings?.rate ?? 0.2; S.links = d.links || []; S.adminUsername = d.adminUsername || "admin"; S.slackLast = d.slackLast || null; }
  S.loaded = true;
}
async function reload(soft) {
  try { ingest(await api("bootstrap")); soft ? refresh() : null; return true; }
  catch (e) { if (e.status === 503) showSetup(e.data); else if (e.status !== 401 && !soft) toast(e.message); return false; }
}

/* ---------- revenue math ---------- */
function monthCalc(doc, rate = S.rate) {
  if (doc && (typeof doc.revenue === "number" || typeof doc.costs === "number")) {
    const total = +doc.revenue || 0, cost = typeof doc.costs === "number" ? doc.costs : 0;
    return { gross: 0, comm: total, other: 0, total, cost, profit: total - cost, clients: [], otherRows: [], costRows: [] };
  }
  const clients = (doc?.clients || []).filter(c => c && (c.name || c.gross));
  const other = (doc?.other || []).filter(o => o && (o.label || o.amount));
  const gross = clients.reduce((a, c) => a + (+c.gross || 0), 0);
  const comm = gross * rate;
  const oth = other.reduce((a, o) => a + (+o.amount || 0), 0);
  const costRows = (doc?.costs || []).filter(o => o && (o.label || o.amount));
  const cost = costRows.reduce((a, o) => a + (+o.amount || 0), 0);
  const total = comm + oth;
  return { gross, comm, other: oth, total, cost, profit: total - cost, clients, otherRows: other, costRows };
}
const rateOf = ym => (S.months[ym]?.rate ?? S.rate);
const calcOf = ym => monthCalc(S.months[ym], rateOf(ym));
const totalOf = ym => calcOf(ym).total;
const signUsd = n => (n < 0 ? "−" : "") + usd(Math.abs(n));

/* ---------- chart ---------- */
function niceStep(x) { const p = Math.pow(10, Math.floor(Math.log10(x))); const f = x / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
function chartSVG(endYm, n = 12) {
  const ms = []; for (let i = n - 1; i >= 0; i--) { const ym = addM(endYm, -i); ms.push({ ym, ...calcOf(ym) }); }
  const W = 760, H = 280, pl = 58, pr = 8, pt = 26, pb = 30;
  const max = Math.max(...ms.map(m => Math.max(m.total, m.cost, m.profit)), 0);
  const min = Math.min(...ms.map(m => m.profit), 0);
  const step = (max - min) > 0 ? niceStep((max - min) / 4) : 2500;
  const top = step * Math.max(1, Math.ceil(max / step)), bot = -step * Math.ceil(-min / step);
  const iw = W - pl - pr, ih = H - pt - pb, bw = iw / n, barW = Math.min(17, bw * .3);
  const y = v => pt + ih - ((v - bot) / (top - bot)) * ih;
  let g = "";
  for (let v = bot; v <= top + 1e-9; v += step) g += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,${Math.abs(v) < 1e-9 ? .2 : .06})"/><text x="${pl - 10}" y="${y(v) + 4}" text-anchor="end">${v < 0 ? "−" + usdK(-v) : usdK(v)}</text>`;
  const cur = ymNow(), pts = [];
  ms.forEach((m, i) => {
    const cx = pl + bw * i + bw / 2, isCur = m.ym === cur, has = m.total > 0 || m.cost > 0;
    g += `<g><title>${ymLabel(m.ym, true)}: revenue ${usd(m.total)}, costs ${usd(m.cost)}, profit ${signUsd(m.profit)}</title><rect x="${pl + bw * i}" y="${pt}" width="${bw}" height="${ih}" fill="transparent"/>`;
    if (m.comm > 0) g += `<rect x="${cx - barW - 1.5}" y="${y(m.comm)}" width="${barW}" height="${Math.max(0, y(0) - y(m.comm))}" rx="2.5" fill="${isCur ? "#d4bc72" : "#c4a852"}"/>`;
    if (m.other > 0) g += `<rect x="${cx - barW - 1.5}" y="${y(m.total)}" width="${barW}" height="${Math.max(0, y(m.comm) - y(m.total))}" rx="2.5" fill="#8a7739"/>`;
    if (m.cost > 0) g += `<rect x="${cx + 1.5}" y="${y(m.cost)}" width="${barW}" height="${Math.max(0, y(0) - y(m.cost))}" rx="2.5" fill="#52525b"/>`;
    if (has) { pts.push([cx, y(m.profit), m]); g += `<text class="vl" x="${cx}" y="${Math.min(y(m.total), y(m.cost), y(m.profit)) - 9}" text-anchor="middle" ${m.profit < 0 ? 'style="fill:#f87171"' : ""}>${m.profit < 0 ? "−" + usdK(-m.profit) : usdK(m.profit)}</text>`; }
    g += `</g><text x="${cx}" y="${H - 10}" text-anchor="middle" ${isCur ? 'style="fill:#d4d4d8;font-weight:600"' : ""}>${MN[+m.ym.slice(5) - 1]}${m.ym.endsWith("-01") || i === 0 ? " ’" + m.ym.slice(2, 4) : ""}</text>`;
  });
  if (pts.length > 1) g += `<polyline points="${pts.map(p => p[0] + "," + p[1]).join(" ")}" fill="none" stroke="#f4f4f5" stroke-width="1.6" stroke-linejoin="round" opacity=".85"/>`;
  pts.forEach(([x, yy, m]) => g += `<circle cx="${x}" cy="${yy}" r="3.6" fill="${m.profit < 0 ? "#f87171" : "#f4f4f5"}" stroke="#09090b" stroke-width="1.5"/>`);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Revenue, costs and profit, last ${n} months">${g}</svg>`;
}

/* ---------- shell ---------- */
function showShell() { $("#login").hidden = true; $("#app").hidden = false; }
function showLogin(msg) {
  $("#app").hidden = true; const L = $("#login"); L.hidden = false;
  L.innerHTML = `<form class="login-card" id="login-form" novalidate>
    <img class="wm" alt="InfoFunnels" src="/wordmark.png"><div class="tag">Headquarters</div>
    <h1>Sign in</h1><p class="muted">Use the username and password you were given.</p>
    <label class="f" for="li-user">Username<input class="inp" id="li-user" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
    <label class="f" for="li-pass">Password<input class="inp" id="li-pass" type="password" autocomplete="current-password"></label>
    <div class="err" id="li-err" role="alert">${esc(msg || "")}</div>
    <button class="btn" id="li-go" type="submit">Sign in</button>
  </form>`;
  $("#li-user").value = ls.get("hq.user") || ""; ($("#li-user").value ? $("#li-pass") : $("#li-user")).focus();
  $("#login-form").addEventListener("submit", async e => {
    e.preventDefault(); const b = $("#li-go"), u = $("#li-user").value.trim(), p = $("#li-pass").value;
    if (!u || !p) { $("#li-err").textContent = "Enter your username and password."; return; }
    b.disabled = true; b.textContent = "Signing in…";
    try { await api("login", { username: u, password: p }); ls.set("hq.user", u); await start(); }
    catch (err) { if (err.status === 503) return showSetup(err.data); $("#li-err").textContent = err.message; b.disabled = false; b.textContent = "Sign in"; }
  });
}
function showSetup(d) {
  $("#app").hidden = true; const L = $("#login"); L.hidden = false;
  L.innerHTML = `<div class="login-card"><img class="wm" alt="InfoFunnels" src="/wordmark.png"><div class="tag">Headquarters</div><h1>Almost there</h1><p class="muted">HQ is deployed but still needs these settings in Vercel (Project → Settings → Environment Variables / Storage), then a redeploy:</p><ul class="steps" style="margin:6px 0 0">${(d?.missing || []).map(m => `<li>${esc(m)}</li>`).join("")}</ul></div>`;
}
function setView(v) {
  const list = S.owner ? VIEWS_OWNER : VIEWS_TEAM;
  if (!list.some(x => x[0] === v)) v = list[0][0];
  S.view = v; ls.set("hq.view", v);
  if (location.hash.slice(1) !== v) history.replaceState(null, "", "#" + v);
  $("#nav").innerHTML = list.map(([k, l]) => `<button type="button" data-view="${k}" ${k === v ? 'aria-current="page"' : ""}>${ICONS[k]}<span>${l}</span></button>`).join("") + `<button type="button" class="mob-only" data-logout>Sign out</button>`;
  paintNavBadge();
  renderView();
  window.scrollTo(0, 0);
}
document.addEventListener("click", e => { const b = e.target.closest("[data-view]"); if (b) setView(b.dataset.view); });
function head(eyebrow, title, sub, right = "") {
  return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ""}</div>${right}</div>`;
}
function renderView() {
  const m = $("#main");
  if (S.view === "dashboard") m.innerHTML = viewDashboard();
  else if (S.view === "revenue") { m.innerHTML = viewRevenue(); paintEditor(); }
  else if (S.view === "eod") { m.innerHTML = viewEod(); fillEodForm(); }
  else if (S.view === "reports") m.innerHTML = viewReports();
  else if (S.view === "links") m.innerHTML = viewLinks();
  else if (S.view === "team") m.innerHTML = viewTeam();
  else if (S.view === "applications") { m.innerHTML = viewApplications(); renderAppsList(); renderAppsMain(); if (!A.forms) loadAppForms(true); }
}
/* re-render data-bound parts without touching inputs being edited */
function refresh() {
  if (S.view === "dashboard") $("#main").innerHTML = viewDashboard();
  else if (S.view === "revenue") { const a = $("#rev-summary"); if (a) a.innerHTML = revSummary(); const t = $("#rev-table"); if (t) t.innerHTML = revTable(); }
  else if (S.view === "reports") { const f = $("#feed"); if (f) f.innerHTML = feedHTML(); const st = $("#today-status"); if (st) st.innerHTML = todayStatusHTML(); }
  else if (S.view === "links") { const l = $("#links-grid"); if (l) l.innerHTML = linksGrid(true); }
  else if (S.view === "team") { const l = $("#team-list"); if (l) l.innerHTML = teamList(); }
  else if (S.view === "eod") { const st = $("#eod-existing"); if (st) st.innerHTML = existingNote(); }
}

/* ---------- people ---------- */
const nameOf = uid => S.users[uid]?.name || "Former member";
function avatar(uid, size = 32) {
  const n = nameOf(uid).trim(), ini = (n.split(/\s+/).map(w => w[0]).join("").slice(0, 2) || "?").toUpperCase();
  let h = 0; for (const c of uid) h = (h * 31 + c.charCodeAt(0)) % 360;
  return `<span class="av" style="width:${size}px;height:${size}px;font-size:${Math.round(size * .38)}px;background:hsl(${h} 28% 22%);color:hsl(${h} 60% 80%)" aria-hidden="true">${esc(ini)}</span>`;
}
function activeIds() { const ids = Object.values(S.users).filter(u => u.active !== false).map(u => u.id); return [...new Set([...(S.uid ? [S.uid] : []), ...ids])]; }
function todayStatusHTML() {
  const ids = activeIds().filter(id => id !== "admin" || S.owner || (S.reports.admin || []).length);
  if (!ids.length) return `<div class="empty"><b>No team members yet</b>Add your team on the Team page.</div>`;
  const t = todayStr();
  return `<div class="people">${ids.map(uid => {
    const done = (S.reports[uid] || []).some(r => r.date === t);
    return `<div class="person">${avatar(uid)}<div class="who"><b>${esc(nameOf(uid))}${uid === S.uid ? ' <span class="dim" style="font-weight:400">(you)</span>' : ""}</b><small>${esc(S.users[uid]?.role || "—")}</small></div><span class="chip ${done ? "ok" : "pend"}">${done ? "Submitted" : "Pending"}</span></div>`;
  }).join("")}</div>`;
}

/* ---------- dashboard ---------- */
function kpisHTML() {
  const cur = ymNow(), prev = addM(cur, -1);
  const c = calcOf(cur), p = calcOf(prev);
  let r12 = 0, c12 = 0; for (let i = 0; i < 12; i++) { const m = calcOf(addM(cur, -i)); r12 += m.total; c12 += m.cost; }
  const margin = c.total > 0 ? Math.round(c.profit / c.total * 100) + "% margin" : "No revenue yet";
  let d = ""; if (p.profit !== 0) { const ch = (c.profit - p.profit) / Math.abs(p.profit) * 100; const cls = ch > .5 ? "up" : ch < -.5 ? "down" : "flat"; d = `<span class="delta ${cls}">${ch > 0 ? "▲" : ch < 0 ? "▼" : "•"} ${Math.abs(ch).toFixed(0)}% vs ${MN[+prev.slice(5) - 1]}</span>`; }
  const neg = v => v < 0 ? ' style="color:var(--bad)"' : "";
  return `<div class="kpis">
    <div class="kpi lead"><span class="lab">Profit · ${ymLabel(cur, true)}</span><span class="val"${neg(c.profit)}>${signUsd(c.profit)}</span><span class="note">${margin}</span>${d}</div>
    <div class="kpi"><span class="lab">Revenue · ${MN[+cur.slice(5) - 1]}</span><span class="val">${usd(c.total)}</span><span class="note">${MN[+prev.slice(5) - 1]}: ${usd(p.total)}</span></div>
    <div class="kpi"><span class="lab">Costs · ${MN[+cur.slice(5) - 1]}</span><span class="val">${usd(c.cost)}</span><span class="note">${MN[+prev.slice(5) - 1]}: ${usd(p.cost)}</span></div>

/* paste import: "month revenue costs" per line */
const MONTH_PREFIX = [["jan"], ["feb"], ["mar"], ["apr"], ["may", "maj"], ["jun"], ["jul"], ["aug"], ["sep"], ["oct", "okt"], ["nov"], ["dec"]];
function parseMonth(s) {
  s = String(s || "").trim(); let m;
  if ((m = s.match(/^(\d{4})[-\/.](\d{1,2})$/))) return `${m[1]}-${pad(m[2])}`;
  if ((m = s.match(/^(\d{1,2})[-\/.](\d{4})$/))) return `${m[2]}-${pad(m[1])}`;
  if ((m = s.match(/^([A-Za-zåäöÅÄÖ]{3,})[\s\-'’,.]*(\d{2}|\d{4})$/))) {
    const w = m[1].toLowerCase(), i = MONTH_PREFIX.findIndex(ps => ps.some(p => w.startsWith(p)));
    if (i >= 0) return `${m[2].length === 2 ? "20" + m[2] : m[2]}-${pad(i + 1)}`;
  }
  return null;
}
function parseImport(text) {
  const rows = [];
  for (const line of text.split(/\r?\n/)) {
    if (!line.trim()) continue;
    let cols = /[\t;]/.test(line) ? line.split(/[\t;]/).map(c => c.trim()) : null;
    if (!cols) { const m = line.trim().match(/^(.*?[A-Za-zåäö]{3,}[\s\-'’,.]*\d{2,4}|\d{4}[-\/.]\d{1,2}|\d{1,2}[-\/.]\d{4})\s+(.*)$/i); if (!m) continue; cols = [m[1], ...m[2].trim().split(/\s+/)]; }
    const ym = parseMonth(cols[0]); if (!ym) continue;
    const nums = cols.slice(1).filter(c => c !== "");
    if (!nums.length) continue;
    rows.push({ ym, revenue: money(nums[0]), costs: nums.length > 1 ? money(nums[1]) : null });
  }
  S.importRows = rows;
  const p = $("#imp-preview"), b = $("#imp-go");
  if (!rows.length) { p.textContent = text.trim() ? "No rows recognised. Each line needs a month (like 2026-09 or Sep 2026), then revenue, then costs." : "Nothing pasted yet."; b.disabled = true; return; }
  const ms = rows.map(r => r.ym).sort();
  p.textContent = `${rows.length} month${rows.length > 1 ? "s" : ""}, ${ymLabel(ms[0])} to ${ymLabel(ms[ms.length - 1])}. Revenue ${usd(rows.reduce((a, r) => a + r.revenue, 0))}, costs ${usd(rows.reduce((a, r) => a + (r.costs || 0), 0))}.`;
  b.disabled = false;
}
async function runImport(btn) {
  const rows = S.importRows || []; if (!rows.length) return;
  btn.disabled = true; let n = 0;
  try {
    for (const r of rows) {
      const prev = S.months[r.ym];
      const doc = { revenue: r.revenue, costs: r.costs ?? (prev ? calcOf(r.ym).cost : 0), note: prev?.note || "" };
      const res = await api("saveMonth", { ym: r.ym, doc }); S.months[r.ym] = res.doc; n++;
    }
    toast(`Imported ${n} month${n > 1 ? "s" : ""}.`);
    $("#imp-text").value = ""; parseImport(""); S.edit = null; refresh(); paintEditor();
  } catch (e) { toast(`Imported ${n} month${n === 1 ? "" : "s"}, then saving failed: ${e.message}`); refresh(); }
  btn.disabled = false;
}

];

function myReport(date) { return (S.reports[S.uid] || []).find(r => r.date === date); }
function existingNote() { const d = $("#eod-date")?.value || todayStr(); return myReport(d) ? `<div class="notice">You already sent a report for this day. Submitting again updates it${S.slackOn ? " and posts the update to Slack" : ""}.</div>` : ""; }

  }

}
function qInput(q) {

function readForm() {
  const v = id => ($("#q-" + id)?.value || "").trim();

let draftT; function saveDraft() { clearTimeout(draftT); draftT = setTimeout(() => { if ($("#eod-form")) ls.set("hq.draft." + S.uid, readForm()); }, 400); }
let submitting = false;
async function submitEod(btn) {

function slackText(r, uid) {

    <div class="row"><label class="f" for="af-title">Title<input class="inp" id="af-title" data-af="title" value="${esc(d.title)}" placeholder="Closer Applications" maxlength="100"></label>
      <label class="f" for="af-status">Status<select class="inp" id="af-status" data-af="status"><option value="open" ${d.status === "open" ? "selected" : ""}>Open · accepting applications</option><option value="closed" ${d.status === "closed" ? "selected" : ""}>Closed · shows "application is closed"</option></select></label></div>
    <label class="f" for="af-slug">Link<span class="aslug"><span>${esc(SITE.replace(/^https?:\/\//, ""))}/applications/</span><input class="inp" id="af-slug" data-af="slug" value="${esc(d.slug)}" maxlength="40" ${C.isNew ? "" : "disabled"} placeholder="closer" autocapitalize="none" spellcheck="false"></span>
      <span class="hint">${C.isNew ? "Lowercase letters, numbers and dashes. This can't be changed after you save." : "The link can't be changed once it's shared."}</span></label>
    ${C.isNew ? `<label class="f" for="af-tpl" style="margin-top:12px">Start from<select class="inp" id="af-tpl">${Object.entries(APP_TEMPLATES).map(([k, v]) => `<option value="${k}" ${C.template === k ? "selected" : ""}>${esc(v[0])}</option>`).join("")}</select><span class="hint">Fills in the questions below. You can still edit, add and remove everything.</span></label>` : ""}
  </section>
  <section class="panel"><h2>Job details</h2><p class="psub">Shown in a box above the form. Rows with an empty value are hidden.</p>
    ${d.details.map((x, i) => `<div class="drow"><input class="inp" list="app-presets" data-ad="${i}" data-ak="label" value="${esc(x.label)}" placeholder="Label" aria-label="Label" maxlength="40"><input class="inp" data-ad="${i}" data-ak="value" value="${esc(x.value)}" placeholder="Value" aria-label="Value for ${esc(x.label)}" maxlength="200"><button class="icon-btn" data-aact="rmd" data-i="${i}" aria-label="Remove ${esc(x.label)}">×</button></div>`).join("")}
    <datalist id="app-presets">${APP_PRESETS.map(p => `<option value="${p}">`).join("")}</datalist>
    <div class="row" style="gap:6px;margin:10px 0 0">${[`<button class="btn ghost sm" data-aact="addd" style="flex:0 0 auto">+ Add detail</button>`, ...missing.map(p => `<button class="btn ghost sm" data-aact="preset" data-p="${esc(p)}" style="flex:0 0 auto">+ ${esc(p)}</button>`)].join("")}</div>
  </section>
  <section class="panel"><h2>About the role</h2><p class="psub">Free text under the details box: your results, what you're looking for, anything applicants should know.</p>
    <textarea class="inp" id="af-about" data-af="about" rows="5" maxlength="4000" placeholder="We're looking for experienced closers who can operate at a high level immediately.">${esc(d.about)}</textarea></section>
  <section class="panel"><h2>Questions</h2><p class="psub">Applicants answer these in order. Changing a question later doesn't change answers already received.</p>
    ${d.questions.map(appQHTML).join("")}
    <button class="btn ghost sm" data-aact="addq">+ Add question</button></section>
  <section class="panel"><h2>After they submit</h2>
    <label class="f" for="af-success" style="margin-top:10px">Confirmation message<textarea class="inp" id="af-success" data-af="successMessage" rows="2" maxlength="500" placeholder="Thanks, your application is in. If it's a fit, we'll reach out.">${esc(d.successMessage)}</textarea></label></section>
  <div class="savebar"><span class="muted">${C.isNew ? "Not saved yet." : "Changes are saved when you press Save."}</span>
    <div class="row" style="flex:0 1 auto;gap:8px;margin:0">${C.isNew ? "" : `<button class="btn danger" data-aact="del" style="flex:0 0 auto">Delete form</button>`}<button class="btn" data-aact="save" style="flex:0 0 auto">${C.isNew ? "Create form" : "Save changes"}</button></div></div></div>`;
}
function appQHTML(q, i, all) {
  return `<div class="aq"><div class="aqh"><span>Question ${i + 1}</span><span><button class="icon-btn mv" data-aact="upq" data-i="${i}" aria-label="Move up" ${i === 0 ? "disabled" : ""}>↑</button><button class="icon-btn mv" data-aact="downq" data-i="${i}" aria-label="Move down" ${i === all.length - 1 ? "disabled" : ""}>↓</button><button class="icon-btn" data-aact="rmq" data-i="${i}" aria-label="Remove question ${i + 1}">×</button></span></div>
    <div class="row"><label class="f" style="flex:2 1 240px">Question<input class="inp" data-aqi="${i}" data-aqf="label" value="${esc(q.label)}" maxlength="200" placeholder="e.g. Best Month Revenue"></label>
      <label class="f">Answer type<select class="inp" data-aqi="${i}" data-aqf="type">${Object.entries(APP_TYPES).map(([k, v]) => `<option value="${k}" ${q.type === k ? "selected" : ""}>${v}</option>`).join("")}</select></label></div>
    <label class="f" style="margin-bottom:8px">Help text <span class="hint">Optional, shown under the question</span><input class="inp" data-aqi="${i}" data-aqf="help" value="${esc(q.help)}" maxlength="300"></label>
    ${q.type === "select" ? `<label class="f" style="margin-bottom:8px">Options <span class="hint">One per line, at least two</span><textarea class="inp" data-aqi="${i}" data-aqf="optionsText" rows="3">${esc(q.optionsText)}</textarea></label>` : ""}
    <label class="chk"><input type="checkbox" data-aqi="${i}" data-aqf="required" ${q.required ? "checked" : ""}> Required</label></div>`;
}

/* applications tab */
async function appLoadSubs() {
  const slug = A.cur.draft.slug;
  try {
    const j = await appApi("listSubmissions", { slug });
    if (!A.cur || A.cur.draft.slug !== slug) return;
    A.cur.subs = j.submissions; A.cur.retention = j.retentionDays;
    appSyncCounts(slug); renderAppsList(); renderAppsMain();
  } catch (err) { if (err.status !== 401) $("#apps-main")?.insertAdjacentHTML("beforeend", `<p class="bad">${esc(err.message)}</p>`); }
}
function appSyncCounts(slug) {
  const f = (A.forms || []).find(x => x.slug === slug); if (!f || !A.cur?.subs) return;
  f.count = A.cur.subs.length; f.newCount = A.cur.subs.filter(s => s.status === "new").length; paintNavBadge();
}
const appName = s => (s.answers.find(a => /name/i.test(a.label) && a.value) || s.answers.find(a => a.value) || {}).value || "Unnamed";
const appEmail = s => (s.answers.find(a => /@/.test(a.value) && !/\s/.test(a.value)) || {}).value || "";
const appWhen = iso => new Date(iso).toLocaleString("en-GB", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
const linkify = s => esc(s).replace(/https?:\/\/[^\s<]*[^\s<.,;:!?)]/g, u => `<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
function appSubsHTML() {
  const C = A.cur;
  if (!C.subs) return `<p class="muted">Loading applications…</p>`;
  const all = C.subs, n = k => all.filter(s => s.status === k).length;
  if (!all.length) return `<div class="empty"><b>No applications yet</b>Share <span class="gold">${esc(appUrl(C.draft.slug))}</span> and they'll show up here.</div>`;
  const list = C.filter === "all" ? all : all.filter(s => s.status === C.filter);
  return `<div class="afilters">${[["all", "All", all.length], ...Object.entries(APP_STATUS).map(([k, v]) => [k, v, n(k)])].map(([k, v, c]) => `<button class="pill" data-aact="filter" data-f="${k}" aria-pressed="${C.filter === k}">${v} ${c}</button>`).join("")}
      <span style="flex:1"></span><button class="btn ghost sm" data-aact="csv">Export CSV</button></div>
    ${list.map(s => `<details class="asub"${C.openId === s.id ? " open" : ""} data-sid="${esc(s.id)}"><summary><span class="who">${esc(appName(s))}<small>${esc(appEmail(s))}</small></span><span class="chip ${s.status}">${APP_STATUS[s.status]}</span><span class="when">${esc(appWhen(s.submittedAt))}</span></summary>
      <div class="sbody"><div class="ctl"><span class="muted" style="font-size:12.5px">Move to</span>${Object.entries(APP_STATUS).filter(([k]) => k !== s.status).map(([k, v]) => `<button class="btn ghost sm" data-aact="status" data-id="${esc(s.id)}" data-st="${k}">${v}</button>`).join("")}
        <span style="flex:1"></span><button class="btn danger sm" data-aact="delsub" data-id="${esc(s.id)}">Delete</button></div>
      <dl class="qa">${s.answers.map(a => `<dt>${esc(a.label)}</dt><dd>${a.value ? linkify(a.value) : '<span class="dim">No answer</span>'}</dd>`).join("")}</dl></div></details>`).join("") || `<p class="muted">Nothing here with that status.</p>`}
    <p class="dim" style="margin-top:14px;font-size:12.5px">Applications are deleted automatically after ${C.retention || 365} days. Export the ones you want to keep.</p>`;
}
function appCsv() {
  const subs = A.cur.subs, cols = [];
  subs.forEach(s => s.answers.forEach(a => { if (!cols.includes(a.label)) cols.push(a.label); }));
  const cell = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const rows = [["Submitted", "Status", ...cols].map(cell).join(",")];
  subs.forEach(s => rows.push([s.submittedAt, APP_STATUS[s.status], ...cols.map(c => (s.answers.find(a => a.label === c) || {}).value || "")].map(cell).join(",")));
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + rows.join("\r\n")], { type: "text/csv;charset=utf-8" }));
  a.download = `${A.cur.draft.slug}-applications.csv`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function appSave(btn) {
  const C = A.cur, d = C.draft;
  if (!d.title.trim()) { toast("Give the form a title."); return $("#af-title").focus(); }
  d.slug = d.slug.replace(/-+$/, ""); if ($("#af-slug")) $("#af-slug").value = d.slug;
  if (!d.slug) { toast("Add a link ending, for example \"closer\"."); return $("#af-slug").focus(); }
  btn.disabled = true; btn.textContent = "Saving…";
  try {
    const { form } = await appApi("saveForm", { form: appPayload(d), isNew: C.isNew });
    A.forms = (await appApi("listForms")).forms;
    A.cur = { isNew: false, slugTouched: true, tab: "form", draft: toDraft(form), subs: null, filter: "all" };
    renderAppsList(); renderAppsMain(); paintNavBadge(); window.scrollTo({ top: 0, behavior: "smooth" });
    toast(C.isNew ? "Form created. Its link is live." : "Saved.");
  } catch (err) { btn.disabled = false; btn.textContent = C.isNew ? "Create form" : "Save changes"; if (err.status !== 401) toast(err.message); }
}

/* events (scoped to the Applications view and the dashboard panel) */
document.addEventListener("input", e => {
  const C = A.cur, t = e.target; if (S.view !== "applications" || !C || !t.closest("#apps-main")) return;
  const d = C.draft;
  if (t.dataset.af) {
    if (t.dataset.af === "slug") { t.value = t.value.toLowerCase().replace(/[^a-z0-9-]+/g, "-").replace(/^-+/, "").slice(0, 40); C.slugTouched = true; }
    d[t.dataset.af] = t.value;
    if (t.dataset.af === "title") { const h = $("#ah-title"); if (h) h.textContent = d.title || "Untitled form"; if (C.isNew && !C.slugTouched) { d.slug = slugify(d.title); $("#af-slug").value = d.slug; } }
  } else if (t.dataset.ad !== undefined) d.details[+t.dataset.ad][t.dataset.ak] = t.value;
  else if (t.dataset.aqi !== undefined && t.dataset.aqf !== "type") { d.questions[+t.dataset.aqi][t.dataset.aqf] = t.type === "checkbox" ? t.checked : t.value; C.qTouched = true; }
});
document.addEventListener("change", e => {
  const C = A.cur, t = e.target; if (S.view !== "applications" || !C || !t.closest("#apps-main")) return;
  const d = C.draft;
  if (t.id === "af-tpl") {
    if (C.qTouched && !confirm("Replace the questions below with this starting set?")) { t.value = C.template; return; }
    C.template = t.value; C.qTouched = false; d.questions = APP_TEMPLATES[t.value][1]();
    const role = d.details.find(x => x.label === "Role"); if (role && !role.value && t.value === "closer") role.value = "Closer";
    renderAppsMain();
  } else if (t.dataset.aqf === "type") { d.questions[+t.dataset.aqi].type = t.value; C.qTouched = true; renderAppsMain(); }
  else if (t.dataset.af === "status") d.status = t.value;
});
document.addEventListener("toggle", e => { const el = e.target; if (el.matches?.("details.asub") && A.cur) { if (el.open) A.cur.openId = el.dataset.sid; else if (A.cur.openId === el.dataset.sid) A.cur.openId = null; } }, true);
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-aact]"); if (!b) return;
  const act = b.dataset.aact, i = +b.dataset.i;
  if (act === "dash-new") { setView("applications"); return appNewForm(); }
  if (act === "dash-open") { setView("applications"); return appOpenForm(b.dataset.slug, "apps"); }
  if (act === "new") return appNewForm();
  if (act === "open") return appOpenForm(b.dataset.slug, (A.forms.find(f => f.slug === b.dataset.slug)?.newCount ? "apps" : "form"));
  const C = A.cur; if (!C) return;
  const d = C.draft;
  if (act === "tab") { C.tab = b.dataset.tab; return renderAppsMain(); }
  if (act === "addd") { d.details.push({ label: "", value: "" }); renderAppsMain(); return $(`[data-ad="${d.details.length - 1}"][data-ak="label"]`)?.focus(); }
  if (act === "preset") { const empty = d.details.find(x => !x.label && !x.value); if (empty) empty.label = b.dataset.p; else d.details.push({ label: b.dataset.p, value: "" }); renderAppsMain(); return $(`[data-ad="${d.details.findIndex(x => x.label === b.dataset.p)}"][data-ak="value"]`)?.focus(); }
  if (act === "rmd") { d.details.splice(i, 1); return renderAppsMain(); }
  if (["addq", "rmq", "upq", "downq"].includes(act)) C.qTouched = true;
  if (act === "addq") { d.questions.push(AQ("", "text", "", false)); renderAppsMain(); return $(`[data-aqi="${d.questions.length - 1}"][data-aqf="label"]`)?.focus(); }
  if (act === "rmq") { d.questions.splice(i, 1); return renderAppsMain(); }
  if (act === "upq" || act === "downq") { const j = act === "upq" ? i - 1 : i + 1; [d.questions[i], d.questions[j]] = [d.questions[j], d.questions[i]]; return renderAppsMain(); }
  if (act === "copy") { try { await navigator.clipboard.writeText(appUrl(d.slug)); toast("Link copied."); } catch { prompt("Copy this link:", appUrl(d.slug)); } return; }
  if (act === "save") return appSave(b);
  if (act === "del") {
    const f = A.forms.find(x => x.slug === d.slug);
    if (!confirm(`Delete "${d.title}" and its ${f ? f.count : 0} applications? This can't be undone.`)) return;
    try { await appApi("deleteForm", { slug: d.slug }); A.forms = A.forms.filter(x => x.slug !== d.slug); A.cur = null; renderAppsList(); renderAppsMain(); paintNavBadge(); toast("Form deleted."); }
    catch (err) { if (err.status !== 401) toast(err.message); }
    return;
  }
  if (act === "filter") { C.filter = b.dataset.f; return renderAppsMain(); }
  if (act === "csv") return appCsv();
  if (act === "status") {
    try { await appApi("setStatus", { slug: d.slug, id: b.dataset.id, status: b.dataset.st }); C.subs.find(s => s.id === b.dataset.id).status = b.dataset.st; C.openId = b.dataset.id; appSyncCounts(d.slug); renderAppsList(); renderAppsMain(); toast(`Moved to ${APP_STATUS[b.dataset.st]}.`); }
    catch (err) { if (err.status !== 401) toast(err.message); }
    return;
  }
  if (act === "delsub") {
    if (!confirm("Delete this application for good?")) return;
    try { await appApi("deleteSubmission", { slug: d.slug, id: b.dataset.id }); C.subs = C.subs.filter(s => s.id !== b.dataset.id); appSyncCounts(d.slug); renderAppsList(); renderAppsMain(); toast("Application deleted."); }
    catch (err) { if (err.status !== 401) toast(err.message); }
  }
});

/* ---------- boot ---------- */
function renderWho() { $("#who").innerHTML = `${avatar(S.uid, 28)}<span>${esc(nameOf(S.uid))}${S.owner ? " · Owner" : ""}</span><button class="btn ghost sm so" data-logout>Sign out</button>`; }
async function start() {
  const ok = await reload(false); if (!ok) return;
  showShell();
  renderWho();
  setView(location.hash.slice(1) || ls.get("hq.view") || (S.owner ? "dashboard" : "eod"));
  if (S.owner && !A.forms) loadAppForms(true);
}
setInterval(() => { if (S.loaded && document.visibilityState === "visible" && !["revenue", "eod", "team", "applications"].includes(S.view)) { reload(true); if (S.owner) loadAppForms(true); } }, 60000);
document.addEventListener("visibilitychange", () => { if (S.loaded && document.visibilityState === "visible" && ["dashboard", "reports"].includes(S.view)) reload(true); });
start();
})();
</script>
</body>
</html>
