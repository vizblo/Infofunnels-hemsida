<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Applications - InfoFunnels</title>
<link rel="icon" type="image/png" href="/favicon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #09090b;
  --surface: #111114;
  --raise: #1d1d23;
  --line: rgba(255,255,255,.08);
  --line-strong: rgba(255,255,255,.14);
  --fg: #ffffff;
  --fg-2: #d4d4d8;
  --muted: #a1a1aa;
  --dim: #71717a;
  --gold: #c4a852;
  --gold-hi: #d4bc72;
  --gold-soft: rgba(196,168,82,.16);
  --gold-line: rgba(196,168,82,.28);
  --good: #4ade80;
  --good-soft: rgba(74,222,128,.12);
  --warn: #fbbf24;
  --warn-soft: rgba(251,191,36,.12);
  --bad: #f87171;
  --bad-soft: rgba(248,113,113,.12);
  --display: "Plus Jakarta Sans", "Inter", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 12px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font-family: var(--body); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--gold); }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.muted { color: var(--muted); } .dim { color: var(--dim); }

/* login */
.login { min-height: 100vh; display: grid; place-items: center; padding: 40px 16px; background: radial-gradient(circle at 50% 0%, rgba(196,168,82,.14) 0%, transparent 55%), var(--bg); }
.login-card { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 14px; background: linear-gradient(160deg, #18140a 0%, #0b0b12 100%); border: 1px solid var(--gold-line); border-radius: 16px; padding: 30px 26px; }
.login-card .wm { width: 160px; filter: invert(1); }
.login-card .tag { font-family: var(--display); font-weight: 700; font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); margin-top: -6px; }
.login-card h1 { font-size: 24px; font-weight: 800; margin-top: 8px; }
.login-card .btn { width: 100%; padding: 11px 16px; }

/* shell */
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px clamp(16px, 3vw, 32px); border-bottom: 1px solid var(--line); background: #0d0d10; position: sticky; top: 0; z-index: 5; }
.top .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.top img { width: 130px; filter: invert(1); display: block; }
.top .tag { font-family: var(--display); font-weight: 700; font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
.top nav { display: flex; align-items: center; gap: 8px; }
@media (max-width: 560px) { .top .tag { display: none; } .top img { width: 112px; } }
.layout { display: grid; grid-template-columns: 300px minmax(0,1fr); gap: 24px; padding: 24px clamp(16px, 3vw, 32px) 80px; max-width: 1280px; margin: 0 auto; }
@media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
.side { display: flex; flex-direction: column; gap: 10px; align-self: start; }
.side .btn { width: 100%; }
.card { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; gap: 4px; padding: 13px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.card:hover { border-color: var(--gold-line); }
.card[aria-current="true"] { border-color: var(--gold); background: var(--gold-soft); }
.card:focus-visible { outline: 2px solid var(--gold); }
.card .t { font-weight: 600; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.card .u { font-size: 12.5px; color: var(--dim); overflow-wrap: anywhere; }
.empty { border: 1px dashed var(--line-strong); border-radius: var(--r); padding: 40px 24px; text-align: center; color: var(--muted); }
.empty h2 { color: var(--fg); font-size: 18px; margin-bottom: 6px; }

.panel { background: linear-gradient(160deg, #141310 0%, var(--surface) 60%); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; margin-bottom: 16px; }
.panel h2 { font-size: 15.5px; font-weight: 700; margin-bottom: 4px; }
.panel .sub { color: var(--dim); font-size: 12.5px; margin: 0 0 14px; }
.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px 20px; margin-bottom: 18px; }
.head h1 { font-size: clamp(22px, 3vw, 30px); font-weight: 800; letter-spacing: -.02em; }
.head .url { color: var(--gold); font-size: 13px; overflow-wrap: anywhere; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.tabs button { all: unset; cursor: pointer; padding: 10px 14px; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button:hover { color: var(--fg); }
.tabs button[aria-selected="true"] { color: var(--fg); border-color: var(--gold); }
.tabs button:focus-visible { outline: 2px solid var(--gold); }

.btn { all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 16px; border-radius: 9px; font-weight: 600; font-size: 13.5px; background: var(--gold); color: #0b0b0d; white-space: nowrap; }
.btn:hover { background: var(--gold-hi); }
.btn:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.btn[disabled] { opacity: .5; cursor: default; }
.btn.ghost { background: transparent; color: var(--fg-2); box-shadow: inset 0 0 0 1px var(--line-strong); }
.btn.ghost:hover { color: var(--fg); box-shadow: inset 0 0 0 1px var(--gold-line); background: rgba(196,168,82,.06); }
.btn.sm { padding: 6px 11px; font-size: 12.5px; border-radius: 7px; }
.btn.danger { background: transparent; color: var(--bad); box-shadow: inset 0 0 0 1px rgba(248,113,113,.35); }
.btn.danger:hover { background: var(--bad-soft); }
.icon-btn { all: unset; cursor: pointer; color: var(--dim); padding: 4px 8px; border-radius: 6px; font-size: 16px; line-height: 1; }
.icon-btn:hover { color: var(--fg); background: rgba(255,255,255,.06); }
.icon-btn.x:hover { color: var(--bad); background: var(--bad-soft); }
.icon-btn[disabled] { opacity: .3; cursor: default; pointer-events: none; }
.icon-btn:focus-visible { outline: 2px solid var(--gold); }

label.f { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 13px; color: var(--fg-2); min-width: 0; }
label.f .hint { font-weight: 400; color: var(--dim); font-size: 12px; }
.inp { width: 100%; background: var(--bg); border: 1px solid var(--line-strong); border-radius: 9px; padding: 9px 12px; outline: none; min-width: 0; }
.inp:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }
textarea.inp { resize: vertical; min-height: 84px; line-height: 1.5; }
.inp::placeholder { color: var(--dim); }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-bottom: 12px; }
.row > * { flex: 1 1 180px; }
.slug { display: flex; align-items: stretch; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--bg); overflow: hidden; }
.slug:focus-within { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }
.slug span { padding: 9px 0 9px 12px; color: var(--dim); white-space: nowrap; font-weight: 400; }
.slug .inp { border: 0; box-shadow: none; border-radius: 0; padding-left: 2px; }
.slug .inp:disabled { color: var(--muted); }

.drow { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.6fr) auto; gap: 8px; margin-bottom: 8px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
.chips .btn { }
.q { border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 10px; background: rgba(255,255,255,.015); }
.q .qh { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; color: var(--dim); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.q .row { margin-bottom: 8px; }
.chk { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; color: var(--fg-2); cursor: pointer; }
.chk input { accent-color: var(--gold); width: 16px; height: 16px; }
.savebar { position: sticky; bottom: 0; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; padding: 14px 16px; margin-top: 8px; background: rgba(13,13,16,.94); backdrop-filter: blur(8px); border: 1px solid var(--line-strong); border-radius: var(--r); }

.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.open, .chip.shortlisted { color: var(--good); background: var(--good-soft); }
.chip.closed, .chip.rejected { color: var(--bad); background: var(--bad-soft); }
.chip.new { color: var(--warn); background: var(--warn-soft); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; align-items: center; }
.filters .grow { flex: 1; }
.pill { all: unset; cursor: pointer; padding: 5px 12px; border-radius: 99px; font-weight: 600; font-size: 12.5px; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line-strong); }
.pill:hover { color: var(--fg); }
.pill[aria-pressed="true"] { background: var(--gold-soft); color: var(--fg); box-shadow: inset 0 0 0 1px var(--gold); }
.pill:focus-visible { outline: 2px solid var(--gold); }

details.sub { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); margin-bottom: 8px; }
details.sub[open] { border-color: var(--gold-line); }
details.sub summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
details.sub summary::-webkit-details-marker { display: none; }
details.sub summary .who { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
details.sub summary .who small { color: var(--dim); font-weight: 400; margin-left: 8px; }
details.sub summary .when { color: var(--dim); font-size: 12.5px; white-space: nowrap; }
.sbody { padding: 4px 16px 16px; border-top: 1px solid var(--line); }
.sbody .ctl { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 12px 0; }
.sbody .ctl select { width: auto; padding: 6px 10px; }
.qa dt { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); margin-top: 14px; }
.qa dd { margin: 2px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--fg-2); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #1d1d23; border: 1px solid var(--gold-line); padding: 10px 18px; border-radius: 99px; font-weight: 600; z-index: 20; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
.toast.bad { border-color: rgba(248,113,113,.5); color: #fecaca; }
.err { color: var(--bad); }
</style>
</head>
<body>
<div class="login" id="login"><p class="muted">Loading…</p></div>

<div id="app" hidden>
  <div class="top">
    <div class="brand"><img src="/wordmark.png" alt="InfoFunnels"><span class="tag">Applications</span></div>
    <nav><a class="btn ghost sm" href="/admin-dashboard">HQ</a><button class="btn ghost sm" id="logout" type="button">Sign out</button></nav>
  </div>
  <div class="layout">
    <aside class="side"><button class="btn" id="new" type="button">+ New application form</button><div id="list" class="side" role="list"></div></aside>
    <main id="main"></main>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const linkify = s => esc(s).replace(/https?:\/\/[^\s<]*[^\s<.,;:!?)]/g, u => `<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
const SITE = location.origin;
const PRESETS = ["Role", "Niche", "Ticket Price", "Compensation", "Location", "Availability"];
const TYPES = { text: "Short answer", textarea: "Long answer", email: "Email", tel: "Phone", select: "Dropdown", yesno: "Yes / No" };
const STATUS = { new: "New", shortlisted: "Shortlisted", rejected: "Rejected" };

/* Question sets a new form can start from. The label is the field name, "help" is the sentence under it. */
const Q = (label, type, help = "", required = true) => ({ id: "", label, type, help, required, optionsText: "" });
const BASIC = () => [
  Q("Full Name", "text", "Your full name."), Q("Email", "email"), Q("Phone", "tel", "Include the area code. Must have WhatsApp."),
  Q("Instagram Handle", "text"), Q("Country", "text", "What country are you based in?"),
  Q("Previous Roles", "textarea", "What roles have you done previously? Include the offer, price point, compensation and how long."),
  Q("Best Month", "text", "What's the best month you've had in a previous role? Revenue or results.")
];
const CLOSER = () => [
  Q("Full Name", "text", "Applicant's full name."), Q("Email", "email"), Q("Phone", "tel", "Phone number (must have WhatsApp, plus area code)."),
  Q("Instagram Handle", "text"), Q("Country", "text", "What country are you based in?"),
  Q("Previous Sales Roles", "textarea", "What sales roles have you done previously? (Include offer, price point, commission structure, and length of time)"),
  Q("Best Month Revenue", "text", "What's the most revenue you've closed in a single month?"),
  Q("Offer Types Sold", "textarea", "What type of offers have you sold before?"),
  Q("Average vs Top 1% Closer", "textarea", "What do you believe separates an average closer from a top 1% closer?"),
  Q("Biggest Weakness", "textarea", "What's the biggest weakness in your sales game right now?"),
  Q("Job Ends On The Call?", "textarea", "Do you believe a closer's job starts and ends on the sales call? Yes or no, then explain why."),
  Q("Plan If Bookings Dropped 40%", "textarea", "If your booked calls dropped by 40% next week, what would your plan be?"),
  Q("Can Commit 10am-8pm EST, 6 Days", "yesno", "Can you commit to the hours 10AM EST - 8PM EST 6 days a week?"),
  Q("Certainty Or Likability", "textarea", "What's more important: certainty or likability? Explain"),
  Q("Why You Over Everyone Else", "textarea", "Why should we choose you over every other applicant?"),
  Q("Video Introduction", "textarea", "Record a 2-3 minute video answering: who you are, your sales background, why you'd be an asset. Paste the link."),
  Q("Call Recording", "textarea", "Paste a link to a recording of your best close. If you don't have one, explain why.")
];
const TEMPLATES = { basic: ["Basic (name, email, phone, Instagram, country, previous roles, best month)", BASIC], closer: ["Closer (the full set from your Airtable form)", CLOSER], blank: ["Blank (add everything yourself)", () => [Q("Full Name", "text"), Q("Email", "email")]] };

let forms = [];
let cur = null; // { isNew, slugTouched, tab, draft, subs, filter }

/* ---------- api ---------- */
async function api(action, data = {}) {
  const r = await fetch("/api/applications", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action, ...data }) });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { showLogin(); throw new Error("auth"); }
  if (r.status === 503) { showSetup(); throw new Error("setup"); }
  if (!r.ok) throw new Error(j.error || "Something went wrong. Try again.");
  return j;
}
let toastT;
function toast(text, bad) { const t = $("#toast"); t.textContent = text; t.className = "toast" + (bad ? " bad" : ""); t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }
const ls = { get: k => { try { return localStorage.getItem(k) || ""; } catch { return ""; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

/* ---------- login ---------- */
function showSetup() {
  $("#app").hidden = true; const L = $("#login"); L.hidden = false;
  L.innerHTML = `<div class="login-card"><img class="wm" alt="InfoFunnels" src="/wordmark.png"><div class="tag">Applications</div><h1>Not set up yet</h1><p class="muted">The HQ database and login need to be set up in Vercel first. Once HQ at <a href="/admin-dashboard">/admin-dashboard</a> works, this page works too.</p></div>`;
}
function showLogin() {
  $("#app").hidden = true; const L = $("#login"); L.hidden = false;
  L.innerHTML = `<form class="login-card" id="login-form" novalidate>
    <img class="wm" alt="InfoFunnels" src="/wordmark.png"><div class="tag">Applications</div><h1>Sign in</h1>
    <p class="muted" style="margin:-6px 0 4px">Use the same login as HQ.</p>
    <label class="f">Username<input class="inp" name="u" autocomplete="username" autocapitalize="none" required></label>
    <label class="f">Password<input class="inp" name="p" type="password" autocomplete="current-password" required></label>
    <div class="err" id="login-err" role="alert"></div>
    <button class="btn" type="submit">Sign in</button></form>`;
  const f = $("#login-form"); f.u.value = ls.get("hq.user"); (f.u.value ? f.p : f.u).focus();
  f.addEventListener("submit", async e => {
    e.preventDefault(); $("#login-err").textContent = "";
    try {
      const r = await fetch("/api/hq", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "login", username: f.u.value, password: f.p.value }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(r.status === 503 ? "HQ isn't set up in Vercel yet." : j.error || "Couldn't sign in.");
      ls.set("hq.user", f.u.value); start();
    } catch (err) { $("#login-err").textContent = err.message; }
  });
}
$("#logout").onclick = async () => { await fetch("/api/hq", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "logout" }) }); showLogin(); };

/* ---------- list ---------- */
async function start() {
  try { forms = (await api("listForms")).forms; } catch { return; }
  $("#login").hidden = true; $("#app").hidden = false;
  renderList(); renderMain();
}
function renderList() {
  $("#list").innerHTML = forms.map(f => `<button class="card" data-slug="${esc(f.slug)}" aria-current="${cur && !cur.isNew && cur.draft.slug === f.slug}">
      <span class="t"><span>${esc(f.title)}</span><span class="chip ${f.status}">${f.status === "open" ? "Open" : "Closed"}</span></span>
      <span class="u">/applications/${esc(f.slug)} · ${f.count} ${f.count === 1 ? "application" : "applications"}</span></button>`).join("");
}
$("#list").addEventListener("click", e => { const b = e.target.closest(".card"); if (b) openForm(b.dataset.slug); });
$("#new").onclick = () => newForm();

/* ---------- drafts ---------- */
const slugify = s => String(s).toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40);
const toDraft = f => ({ slug: f.slug, title: f.title, status: f.status, about: f.about || "", successMessage: f.successMessage || "",
  details: f.details.map(d => ({ ...d })), questions: f.questions.map(q => ({ ...q, optionsText: (q.options || []).join("\n") })) });
function newForm() {
  cur = { isNew: true, slugTouched: false, tab: "form", template: "basic",
    draft: { slug: "", title: "", status: "open", about: "", successMessage: "", details: PRESETS.map(label => ({ label, value: "" })), questions: BASIC() } };
  renderList(); renderMain(); $("#f-title")?.focus();
}
function openForm(slug) {
  const f = forms.find(x => x.slug === slug); if (!f) return;
  cur = { isNew: false, slugTouched: true, tab: "form", draft: toDraft(f), subs: null, filter: "all" };
  renderList(); renderMain();
}
const payload = d => ({ ...d, details: d.details, questions: d.questions.map(q => ({ id: q.id, label: q.label, help: q.help, type: q.type, required: q.required,
  ...(q.type === "select" ? { options: q.optionsText.split("\n").map(s => s.trim()).filter(Boolean) } : {}) })) });

/* ---------- editor ---------- */
const publicUrl = slug => `${SITE}/applications/${slug}`;
function renderMain() {
  const m = $("#main");
  if (!cur) {
    m.innerHTML = forms.length ? `<div class="empty"><h2>Pick a form</h2><p>Choose one on the left to edit it or see who applied.</p></div>`
      : `<div class="empty"><h2>No application forms yet</h2><p>Create one for a role (closer, setter, UGC creator...) and you get its own link to share.</p><button class="btn" data-act="new" type="button">+ Create your first form</button></div>`;
    return;
  }
  const d = cur.draft, f = forms.find(x => x.slug === d.slug);
  const head = `<div class="head"><div><div class="muted" style="font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)">${cur.isNew ? "New form" : "Application form"}</div>
    <h1 id="h-title">${esc(d.title || "Untitled form")}</h1>${cur.isNew ? "" : `<div class="url">${esc(publicUrl(d.slug))}</div>`}</div>
    ${cur.isNew ? "" : `<div class="actions"><button class="btn ghost sm" data-act="copy" type="button">Copy link</button><a class="btn ghost sm" href="/applications/${esc(d.slug)}" target="_blank" rel="noopener">Open form ↗</a></div>`}</div>`;
  const tabs = cur.isNew ? "" : `<div class="tabs" role="tablist"><button role="tab" data-act="tab" data-tab="form" aria-selected="${cur.tab === "form"}">Form</button><button role="tab" data-act="tab" data-tab="apps" aria-selected="${cur.tab === "apps"}">Applications${f ? ` (${cur.subs ? cur.subs.length : f.count})` : ""}</button></div>`;
  m.innerHTML = head + tabs + (cur.tab === "apps" ? appsHtml() : formHtml());
  if (cur.tab === "apps" && !cur.subs) loadSubs();
}
function formHtml() {
  const d = cur.draft;
  const have = new Set(d.details.map(x => x.label.trim().toLowerCase()));
  const missing = PRESETS.filter(p => !have.has(p.toLowerCase()));
  return `
  <section class="panel"><h2>Basics</h2><p class="sub">The title shows at the top of the page. The link is what you send to applicants.</p>
    <div class="row"><label class="f">Title<input class="inp" id="f-title" data-f="title" value="${esc(d.title)}" placeholder="Closer Applications" maxlength="100"></label>
      <label class="f">Status<select class="inp" data-f="status"><option value="open" ${d.status === "open" ? "selected" : ""}>Open · accepting applications</option><option value="closed" ${d.status === "closed" ? "selected" : ""}>Closed · shows "application is closed"</option></select></label></div>
    <label class="f">Link<span class="slug"><span>${esc(SITE.replace(/^https?:\/\//, ""))}/applications/</span><input class="inp" id="f-slug" data-f="slug" value="${esc(d.slug)}" maxlength="40" ${cur.isNew ? "" : "disabled"} placeholder="closer" autocapitalize="none" spellcheck="false"></span>
      <span class="hint">${cur.isNew ? "Lowercase letters, numbers and dashes. This can't be changed after you save." : "The link can't be changed once it's shared."}</span></label>
    ${cur.isNew ? `<label class="f" style="margin-top:12px">Start from<select class="inp" id="f-tpl">${Object.entries(TEMPLATES).map(([k, v]) => `<option value="${k}" ${cur.template === k ? "selected" : ""}>${esc(v[0])}</option>`).join("")}</select><span class="hint">Fills in the questions below. You can still edit, add and remove everything.</span></label>` : ""}
  </section>
  <section class="panel"><h2>Job details</h2><p class="sub">Shown in a box above the form. Rows with an empty value are hidden.</p>
    ${d.details.map((x, i) => `<div class="drow"><input class="inp" list="presets" data-d="${i}" data-k="label" value="${esc(x.label)}" placeholder="Label" aria-label="Label" maxlength="40"><input class="inp" data-d="${i}" data-k="value" value="${esc(x.value)}" placeholder="Value" aria-label="Value for ${esc(x.label)}" maxlength="200"><button class="icon-btn x" data-act="rmd" data-i="${i}" type="button" aria-label="Remove ${esc(x.label)}">✕</button></div>`).join("")}
    <datalist id="presets">${PRESETS.map(p => `<option value="${p}">`).join("")}</datalist>
    <div class="chips"><button class="btn ghost sm" data-act="addd" type="button">+ Add detail</button>${missing.map(p => `<button class="btn ghost sm" data-act="preset" data-p="${esc(p)}" type="button">+ ${esc(p)}</button>`).join("")}</div>
  </section>
  <section class="panel"><h2>About the role</h2><p class="sub">Free text under the details box: your results, what you're looking for, anything applicants should know.</p>
    <textarea class="inp" data-f="about" rows="5" maxlength="4000" placeholder="We're looking for experienced closers who can operate at a high level immediately.">${esc(d.about)}</textarea></section>
  <section class="panel"><h2>Questions</h2><p class="sub">Applicants answer these in order. Changing a question later doesn't change answers already received.</p>
    ${d.questions.map(qHtml).join("")}
    <button class="btn ghost sm" data-act="addq" type="button">+ Add question</button></section>
  <section class="panel"><h2>After they submit</h2>
    <label class="f">Confirmation message<textarea class="inp" data-f="successMessage" rows="2" maxlength="500" placeholder="Thanks, your application is in. If it's a fit, we'll reach out.">${esc(d.successMessage)}</textarea></label></section>
  <div class="savebar"><span class="muted" id="savehint">${cur.isNew ? "Not saved yet." : "Changes are saved when you press Save."}</span>
    <div class="actions">${cur.isNew ? "" : `<button class="btn danger" data-act="del" type="button">Delete form</button>`}<button class="btn" data-act="save" type="button">${cur.isNew ? "Create form" : "Save changes"}</button></div></div>`;
}
function qHtml(q, i, all) {
  return `<div class="q"><div class="qh"><span>Question ${i + 1}</span><span><button class="icon-btn" data-act="upq" data-i="${i}" type="button" aria-label="Move up" ${i === 0 ? "disabled" : ""}>↑</button><button class="icon-btn" data-act="downq" data-i="${i}" type="button" aria-label="Move down" ${i === all.length - 1 ? "disabled" : ""}>↓</button><button class="icon-btn x" data-act="rmq" data-i="${i}" type="button" aria-label="Remove question ${i + 1}">✕</button></span></div>
    <div class="row"><label class="f" style="flex:2 1 240px">Question<input class="inp" data-qi="${i}" data-qf="label" value="${esc(q.label)}" maxlength="200" placeholder="e.g. Best Month Revenue"></label>
      <label class="f">Answer type<select class="inp" data-qi="${i}" data-qf="type">${Object.entries(TYPES).map(([k, v]) => `<option value="${k}" ${q.type === k ? "selected" : ""}>${v}</option>`).join("")}</select></label></div>
    <label class="f" style="margin-bottom:8px">Help text <span class="hint">(optional, shown under the question)</span><input class="inp" data-qi="${i}" data-qf="help" value="${esc(q.help)}" maxlength="300"></label>
    ${q.type === "select" ? `<label class="f" style="margin-bottom:8px">Options <span class="hint">(one per line, at least two)</span><textarea class="inp" data-qi="${i}" data-qf="optionsText" rows="3">${esc(q.optionsText)}</textarea></label>` : ""}
    <label class="chk"><input type="checkbox" data-qi="${i}" data-qf="required" ${q.required ? "checked" : ""}> Required</label></div>`;
}

/* ---------- editor events ---------- */
const main = $("#main");
function syncTitle() { const h = $("#h-title"); if (h) h.textContent = cur.draft.title || "Untitled form"; }
main.addEventListener("input", e => {
  if (!cur) return; const t = e.target, d = cur.draft;
  if (t.dataset.f) {
    if (t.dataset.f === "slug") { t.value = t.value.toLowerCase().replace(/[^a-z0-9-]+/g, "-").replace(/^-+/, "").slice(0, 40); cur.slugTouched = true; }
    d[t.dataset.f] = t.value;
    if (t.dataset.f === "title") { syncTitle(); if (cur.isNew && !cur.slugTouched) { d.slug = slugify(d.title); $("#f-slug").value = d.slug; } }
  } else if (t.dataset.d !== undefined) d.details[+t.dataset.d][t.dataset.k] = t.value;
  else if (t.dataset.qi !== undefined && t.dataset.qf !== "type") d.questions[+t.dataset.qi][t.dataset.qf] = t.type === "checkbox" ? t.checked : t.value;
});
main.addEventListener("change", e => {
  if (!cur) return; const t = e.target, d = cur.draft;
  if (t.id === "f-tpl") {
    if (d.questions.some(q => q.label) && !confirm("Replace the questions below with this starting set?")) { t.value = cur.template; return; }
    cur.template = t.value; d.questions = TEMPLATES[t.value][1]();
    const role = d.details.find(x => x.label === "Role");
    if (role && !role.value && t.value === "closer") role.value = "Closer";
    renderMain();
  } else if (t.dataset.qf === "type") { d.questions[+t.dataset.qi].type = t.value; renderMain(); }
  else if (t.dataset.f === "status") d.status = t.value;
});
main.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b || !cur && b.dataset.act !== "new") return;
  const act = b.dataset.act, i = +b.dataset.i;
  if (act === "new") return newForm();
  const d = cur.draft;
  if (act === "tab") { cur.tab = b.dataset.tab; return renderMain(); }
  if (act === "addd") { d.details.push({ label: "", value: "" }); renderMain(); return main.querySelector(`[data-d="${d.details.length - 1}"][data-k="label"]`)?.focus(); }
  if (act === "preset") { const empty = d.details.find(x => !x.label && !x.value); if (empty) empty.label = b.dataset.p; else d.details.push({ label: b.dataset.p, value: "" }); renderMain(); return main.querySelector(`[data-d="${d.details.findIndex(x => x.label === b.dataset.p)}"][data-k="value"]`)?.focus(); }
  if (act === "rmd") { d.details.splice(i, 1); return renderMain(); }
  if (act === "addq") { d.questions.push(Q("", "text", "", false)); renderMain(); return main.querySelector(`[data-qi="${d.questions.length - 1}"][data-qf="label"]`)?.focus(); }
  if (act === "rmq") { d.questions.splice(i, 1); return renderMain(); }
  if (act === "upq" || act === "downq") { const j = act === "upq" ? i - 1 : i + 1; [d.questions[i], d.questions[j]] = [d.questions[j], d.questions[i]]; return renderMain(); }
  if (act === "copy") { try { await navigator.clipboard.writeText(publicUrl(d.slug)); toast("Link copied"); } catch { prompt("Copy this link:", publicUrl(d.slug)); } return; }
  if (act === "save") return save(b);
  if (act === "del") return del();
  if (act === "filter") { cur.filter = b.dataset.f; return renderMain(); }
  if (act === "csv") return exportCsv();
  if (act === "delsub") { if (!confirm("Delete this application for good?")) return; try { await api("deleteSubmission", { slug: d.slug, id: b.dataset.id }); cur.subs = cur.subs.filter(s => s.id !== b.dataset.id); const f = forms.find(x => x.slug === d.slug); if (f) f.count = cur.subs.length; renderList(); renderMain(); } catch (err) { if (err.message !== "auth") toast(err.message, true); } }
});
main.addEventListener("change", async e => {
  const t = e.target; if (!t.dataset.sub) return;
  try { await api("setStatus", { slug: cur.draft.slug, id: t.dataset.sub, status: t.value }); cur.subs.find(s => s.id === t.dataset.sub).status = t.value; toast("Status updated"); renderMain(); }
  catch (err) { if (err.message !== "auth") toast(err.message, true); }
});

async function save(btn) {
  const d = cur.draft;
  if (!d.title.trim()) { toast("Give the form a title.", true); return $("#f-title").focus(); }
  d.slug = d.slug.replace(/-+$/, ""); if ($("#f-slug")) $("#f-slug").value = d.slug;
  if (!d.slug) { toast("Add a link ending, for example \"closer\".", true); return $("#f-slug").focus(); }
  btn.disabled = true; btn.textContent = "Saving…";
  try {
    const { form } = await api("saveForm", { form: payload(d), isNew: cur.isNew });
    forms = (await api("listForms")).forms;
    cur = { isNew: false, slugTouched: true, tab: "form", draft: toDraft(form), subs: null, filter: "all" };
    renderList(); renderMain(); window.scrollTo({ top: 0, behavior: "smooth" });
    toast("Saved. Your link is live.");
  } catch (err) { btn.disabled = false; btn.textContent = cur.isNew ? "Create form" : "Save changes"; if (err.message !== "auth") toast(err.message, true); }
}
async function del() {
  const f = forms.find(x => x.slug === cur.draft.slug);
  if (!confirm(`Delete "${cur.draft.title}" and its ${f ? f.count : 0} applications? This can't be undone.`)) return;
  try { await api("deleteForm", { slug: cur.draft.slug }); forms = forms.filter(x => x.slug !== cur.draft.slug); cur = null; renderList(); renderMain(); toast("Form deleted"); }
  catch (err) { if (err.message !== "auth") toast(err.message, true); }
}

/* ---------- applications tab ---------- */
async function loadSubs() {
  const slug = cur.draft.slug;
  try { const j = await api("listSubmissions", { slug }); if (!cur || cur.draft.slug !== slug) return; cur.subs = j.submissions; cur.retention = j.retentionDays;
    const f = forms.find(x => x.slug === slug); if (f) f.count = cur.subs.length; renderList(); renderMain(); }
  catch (err) { if (err.message !== "auth") $("#main").insertAdjacentHTML("beforeend", `<p class="err">${esc(err.message)}</p>`); }
}
const nameOf = s => (s.answers.find(a => /name/i.test(a.label) && a.value) || s.answers.find(a => a.value) || {}).value || "Unnamed";
const emailOf = s => (s.answers.find(a => /@/.test(a.value) && !/\s/.test(a.value)) || {}).value || "";
const fmt = iso => new Date(iso).toLocaleString("en-GB", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
function appsHtml() {
  if (!cur.subs) return `<p class="muted">Loading applications…</p>`;
  const all = cur.subs, n = k => all.filter(s => s.status === k).length;
  const list = cur.filter === "all" ? all : all.filter(s => s.status === cur.filter);
  if (!all.length) return `<div class="empty"><h2>No applications yet</h2><p>Share <b>${esc(publicUrl(cur.draft.slug))}</b> and they'll show up here.</p></div>`;
  return `<div class="filters">${[["all", "All", all.length], ...Object.entries(STATUS).map(([k, v]) => [k, v, n(k)])].map(([k, v, c]) => `<button class="pill" data-act="filter" data-f="${k}" aria-pressed="${cur.filter === k}">${v} ${c}</button>`).join("")}
      <span class="grow"></span><button class="btn ghost sm" data-act="csv" type="button">Export CSV</button></div>
    ${list.map(s => `<details class="sub"><summary><span class="who">${esc(nameOf(s))}<small>${esc(emailOf(s))}</small></span><span class="chip ${s.status}">${STATUS[s.status]}</span><span class="when">${esc(fmt(s.submittedAt))}</span></summary>
      <div class="sbody"><div class="ctl"><label class="muted">Status <select class="inp" data-sub="${esc(s.id)}">${Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${s.status === k ? "selected" : ""}>${v}</option>`).join("")}</select></label>
        <button class="btn danger sm" data-act="delsub" data-id="${esc(s.id)}" type="button">Delete</button></div>
      <dl class="qa">${s.answers.map(a => `<dt>${esc(a.label)}</dt><dd>${a.value ? linkify(a.value) : '<span class="dim">No answer</span>'}</dd>`).join("")}</dl></div></details>`).join("") || `<p class="muted">Nothing here with that status.</p>`}
    <p class="dim" style="margin-top:14px">Applications are deleted automatically after ${cur.retention || 365} days, the next time you open this tab. Export the ones you want to keep.</p>`;
}
function exportCsv() {
  const subs = cur.subs, cols = [];
  subs.forEach(s => s.answers.forEach(a => { if (!cols.includes(a.label)) cols.push(a.label); }));
  const cell = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const rows = [["Submitted", "Status", ...cols].map(cell).join(",")];
  subs.forEach(s => rows.push([s.submittedAt, STATUS[s.status], ...cols.map(c => (s.answers.find(a => a.label === c) || {}).value || "")].map(cell).join(",")));
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + rows.join("\r\n")], { type: "text/csv;charset=utf-8" }));
  a.download = `${cur.draft.slug}-applications.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

start();
</script>
</body>
</html>
