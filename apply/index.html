<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Apply - InfoFunnels</title>
<link rel="icon" type="image/png" href="/favicon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #09090b;
  --surface: #111114;
  --line: rgba(255,255,255,.08);
  --line-strong: rgba(255,255,255,.14);
  --fg: #ffffff;
  --fg-2: #d4d4d8;
  --muted: #a1a1aa;
  --dim: #71717a;
  --gold: #c4a852;
  --gold-hi: #d4bc72;
  --gold-soft: rgba(196,168,82,.16);
  --gold-line: rgba(196,168,82,.28);
  --bad: #f87171;
  --display: "Plus Jakarta Sans", "Inter", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font-family: var(--body); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; background: radial-gradient(circle at 50% 0%, rgba(196,168,82,.12) 0%, transparent 50%), var(--bg); min-height: 100vh; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--gold); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.wrap { max-width: 720px; margin: 0 auto; padding: 40px 20px 72px; }
.logo { display: block; width: 150px; height: auto; filter: invert(1); margin-bottom: 36px; }
.eyebrow { font-family: var(--display); font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }
h1 { font-family: var(--display); font-weight: 800; letter-spacing: -.02em; line-height: 1.12; font-size: clamp(28px, 5vw, 40px); margin: 0 0 24px; text-wrap: balance; }

.details { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin-bottom: 22px; }
.details > div { background: var(--surface); padding: 14px 18px; min-width: 0; }
.details > div:last-child:nth-child(odd) { grid-column: 1 / -1; }
.details dt { font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin-bottom: 2px; }
.details dd { margin: 0; font-weight: 600; color: var(--fg); overflow-wrap: anywhere; }
@media (max-width: 560px) { .details { grid-template-columns: 1fr; } }

.about { color: var(--fg-2); white-space: pre-wrap; margin: 0 0 32px; padding-bottom: 32px; border-bottom: 1px solid var(--line); }

form { display: flex; flex-direction: column; gap: 22px; }
.q { display: flex; flex-direction: column; gap: 6px; border: 0; padding: 0; margin: 0; min-width: 0; }
.q > label, .q > legend { font-weight: 600; font-size: 15px; color: var(--fg); padding: 0; }
.req { color: var(--gold); margin-left: 3px; }
.help { color: var(--muted); font-size: 13.5px; margin: 0; }
.inp { width: 100%; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; padding: 11px 14px; outline: none; min-width: 0; }
.inp:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }
textarea.inp { min-height: 110px; resize: vertical; line-height: 1.5; }
select.inp { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 20px) 50%, calc(100% - 15px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 38px; }
.pills { display: flex; gap: 10px; }
.pills label { cursor: pointer; }
.pills input { position: absolute; opacity: 0; pointer-events: none; }
.pills span { display: inline-block; padding: 9px 26px; border-radius: 99px; border: 1px solid var(--line-strong); background: var(--surface); font-weight: 600; }
.pills input:checked + span { background: var(--gold); border-color: var(--gold); color: #0b0b0d; }
.pills input:focus-visible + span { outline: 2px solid var(--gold); outline-offset: 2px; }
.q.err .inp, .q.err .pills span { border-color: var(--bad); }
.msg { color: var(--bad); font-size: 13.5px; margin: 0; min-height: 0; }
.trap { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

.btn { cursor: pointer; border: 0; border-radius: 99px; padding: 14px 30px; background: var(--gold); color: #0b0b0d; font-family: var(--display); font-weight: 700; font-size: 16px; align-self: flex-start; }
.btn:hover { background: var(--gold-hi); }
.btn[disabled] { opacity: .55; cursor: default; }
.fine { color: var(--dim); font-size: 13px; margin: 0; }
.banner { background: rgba(248,113,113,.1); border: 1px solid rgba(248,113,113,.35); color: #fecaca; border-radius: 10px; padding: 12px 16px; }

.state { text-align: center; padding: 90px 0; }
.state h1 { margin-bottom: 14px; }
.state p { color: var(--fg-2); max-width: 46ch; margin: 0 auto 8px; white-space: pre-wrap; }
.tick { width: 56px; height: 56px; border-radius: 50%; background: var(--gold-soft); border: 1px solid var(--gold-line); display: grid; place-items: center; margin: 0 auto 22px; }
.tick svg { width: 26px; height: 26px; stroke: var(--gold); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.foot { margin-top: 48px; color: var(--dim); font-size: 13px; text-align: center; }
.foot a { color: var(--dim); }
</style>
</head>
<body>
<div class="wrap">
  <a href="/"><img class="logo" src="/wordmark.png" alt="InfoFunnels"></a>
  <div id="root"><p class="fine">Loading…</p></div>
  <div class="foot"><a href="/privacy.html">Privacy Policy</a> &nbsp;·&nbsp; &copy; <span id="year"></span> InfoFunnels</div>
</div>
<script>
const $ = s => document.querySelector(s);
const root = $("#root");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
$("#year").textContent = new Date().getFullYear();
const slug = decodeURIComponent((location.pathname.split("/").filter(Boolean)[1] || "")).toLowerCase();

async function api(action, data) {
  const r = await fetch("/api/applications", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action, slug, ...data }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || "Something went wrong. Try again."); e.field = j.field; e.status = r.status; throw e; }
  return j;
}

function state(title, text, tick) {
  root.innerHTML = `<div class="state">${tick ? `<div class="tick"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>` : ""}<h1>${esc(title)}</h1><p>${esc(text)}</p></div>`;
}

function field(q) {
  const id = "f-" + q.id;
  const head = `<label for="${id}">${esc(q.label)}${q.required ? '<span class="req" aria-hidden="true">*</span>' : ""}</label>`;
  const help = q.help ? `<p class="help" id="${id}-h">${esc(q.help)}</p>` : "";
  const aria = `aria-describedby="${id}-e${q.help ? " " + id + "-h" : ""}"`;
  let input;
  if (q.type === "textarea") input = `<textarea class="inp" id="${id}" name="${q.id}" ${aria} ${q.required ? "required" : ""}></textarea>`;
  else if (q.type === "select") input = `<select class="inp" id="${id}" name="${q.id}" ${aria} ${q.required ? "required" : ""}><option value="">Select…</option>${q.options.map(o => `<option>${esc(o)}</option>`).join("")}</select>`;
  else if (q.type === "yesno") {
    return `<fieldset class="q" data-q="${q.id}"><legend>${esc(q.label)}${q.required ? '<span class="req" aria-hidden="true">*</span>' : ""}</legend>${help}
      <div class="pills"><label><input type="radio" name="${q.id}" value="Yes"><span>Yes</span></label><label><input type="radio" name="${q.id}" value="No"><span>No</span></label></div><p class="msg" id="${id}-e" role="alert"></p></fieldset>`;
  } else {
    const t = q.type === "email" ? "email" : q.type === "tel" ? "tel" : "text";
    const ac = q.type === "email" ? "email" : q.type === "tel" ? "tel" : "off";
    input = `<input class="inp" id="${id}" name="${q.id}" type="${t}" autocomplete="${ac}" ${aria} ${q.required ? "required" : ""}>`;
  }
  return `<div class="q" data-q="${q.id}">${head}${help}${input}<p class="msg" id="${id}-e" role="alert"></p></div>`;
}

function render(f) {
  document.title = f.title + " - InfoFunnels";
  const details = (f.details || []).length ? `<dl class="details">${f.details.map(d => `<div><dt>${esc(d.label)}</dt><dd>${esc(d.value)}</dd></div>`).join("")}</dl>` : "";
  root.innerHTML = `<div class="eyebrow">Application</div><h1>${esc(f.title)}</h1>${details}${f.about ? `<p class="about">${esc(f.about)}</p>` : ""}
    <form id="form" novalidate>${f.questions.map(field).join("")}
      <div class="trap" aria-hidden="true"><label>Website<input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
      <div id="top-err" class="banner" role="alert" hidden></div>
      <button class="btn" type="submit">Submit application</button>
      <p class="fine">By submitting you agree that we process your answers to review your application, as described in our <a href="/privacy.html" target="_blank" rel="noopener">Privacy Policy</a>. Don't include passwords.</p>
    </form>`;
  $("#form").addEventListener("submit", e => submit(e, f));
}

function setErr(qid, text) {
  const wrap = document.querySelector(`[data-q="${qid}"]`); if (!wrap) return;
  wrap.classList.toggle("err", !!text);
  const m = wrap.querySelector(".msg"); if (m) m.textContent = text || "";
}

async function submit(e, f) {
  e.preventDefault();
  const form = e.target, btn = form.querySelector(".btn"), top = $("#top-err");
  top.hidden = true;
  const answers = {}; let first = null;
  for (const q of f.questions) {
    setErr(q.id, "");
    const v = q.type === "yesno" ? (form.querySelector(`input[name="${q.id}"]:checked`) || {}).value || "" : form.elements[q.id].value.trim();
    answers[q.id] = v;
    let bad = "";
    if (!v && q.required) bad = "This one is required.";
    else if (v && q.type === "email" && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) bad = "Enter a valid email address.";
    else if (v && q.type === "tel" && !/^[+\d][\d\s().-]{5,}$/.test(v)) bad = "Enter a valid phone number, including the area code.";
    if (bad) { setErr(q.id, bad); first = first || q.id; }
  }
  if (first) { document.querySelector(`[data-q="${first}"]`).scrollIntoView({ behavior: "smooth", block: "center" }); return; }
  btn.disabled = true; btn.textContent = "Sending…";
  try {
    await api("submit", { answers, website: form.elements.website.value });
    state("Application sent", f.successMessage, true);
    window.scrollTo({ top: 0, behavior: "smooth" });
  } catch (err) {
    btn.disabled = false; btn.textContent = "Submit application";
    if (err.field) { setErr(err.field, err.message.replace(/^.*?: /, "")); document.querySelector(`[data-q="${err.field}"]`)?.scrollIntoView({ behavior: "smooth", block: "center" }); }
    else { top.textContent = err.message; top.hidden = false; top.scrollIntoView({ behavior: "smooth", block: "center" }); }
  }
}

(async () => {
  if (!slug) return state("Application not found", "Check the link you were sent.");
  try {
    const { form } = await api("getForm");
    if (form.status === "closed") { document.title = form.title + " - InfoFunnels"; return state(form.title, "This application is closed right now. Thanks for your interest."); }
    render(form);
  } catch (e) {
    state(e.status === 404 ? "Application not found" : "Something went wrong", e.status === 404 ? "Check the link you were sent, it may have been closed or removed." : e.message);
  }
})();
</script>
</body>
</html>
